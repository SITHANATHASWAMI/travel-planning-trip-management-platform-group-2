spring.application.name=tripnest-backend
server.port=8080

# ======================================================
# ACTIVE PROFILE  (change this one line to switch DB)
#   local    → MySQL  (default, already working)
#   postgres → PostgreSQL
# ======================================================
spring.profiles.active=${APP_PROFILE:local}

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET:TripNestSuperSecretKeyForJWTSigningChangeThisInProduction1234567890}
app.jwt.expiration-ms=86400000

# ==============================
# Google OAuth2
# Only enabled when GOOGLE_CLIENT_ID env var is set to a real value.
# JWT login works without OAuth2.
# ==============================
app.oauth2.success-redirect=http://localhost:3000/oauth2/redirect

# ==============================
# CORS
# ==============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ==============================
# JPA (common — each profile sets dialect)
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Email / SMTP
# HOW TO SET UP GMAIL:
#   1. Enable 2-Step Verification on your Google account.
#   2. Go to: myaccount.google.com -> Security -> App Passwords
#   3. Create a new App Password (select "Mail" + "Windows Computer")
#   4. Copy the 16-character password (no spaces).
#   5. Set environment variables before starting:
#        set MAIL_USERNAME=yourname@gmail.com
#        set MAIL_PASSWORD=abcdabcdabcdabcd
#   OR put them directly below (not recommended for production):
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-gmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Frontend base URL used in reset-password email link
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Password-reset token validity (minutes)
app.password-reset.expiry-minutes=30

# ==============================
# File Upload (documents, photos)
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads/documents}
