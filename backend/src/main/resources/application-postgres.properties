# ======================================================
# PROFILE: postgres  (PostgreSQL — production / local PG)
#
# HOW TO ACTIVATE:
#   Option A — environment variable (recommended):
#     set APP_PROFILE=postgres
#     set DB_PASSWORD=your_postgres_password
#     mvn spring-boot:run
#
#   Option B — command line:
#     mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#
#   Option C — Edit application.properties:
#     Change: spring.profiles.active=local
#     To:     spring.profiles.active=postgres
#
# CREATE DATABASE (run once in psql or pgAdmin):
#   CREATE DATABASE tripnest_db;
# ======================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tripnest_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:swami@06}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.success-redirect=https://tripnest-frontend-eight.vercel.app/oauth2/redirect

# ---- Update the password above to match your PostgreSQL postgres user password ----
# If you reset it in pgAdmin to "swami@06" then no change needed.
# If you used a different password, replace swami@06 with it.

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# update creates tables automatically — change to validate once schema is stable
spring.jpa.hibernate.ddl-auto=update
