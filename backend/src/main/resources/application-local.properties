# ======================================================
# PROFILE: local  (MySQL — active by default)
# ======================================================

# MySQL datasource
# The database "tripnest_db" is created automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:swami@06}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# H2 console disabled in MySQL mode
spring.h2.console.enabled=false

# Cloudinary — persistent document storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:mdewyv04}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
